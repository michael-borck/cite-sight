name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:core
      - run: npm run build:desktop

      # Older tags inherit an executable name from the scoped npm package name.
      # Override packaging metadata while keeping the tagged application source.
      - name: Package AppImage
        working-directory: packages/desktop
        run: npx electron-builder --linux --publish=never -c.linux.executableName=cite-sight

      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            packages/desktop/release/*.AppImage \
            packages/desktop/release/latest-linux.yml
