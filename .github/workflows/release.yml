# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: CiteSight
      node-version: '24'
      build-command: npm run build:core && npm run build:desktop
      package-command: |
        cd packages/desktop
        npx electron-builder --$PLATFORM --publish never
      notarize-check-command: |
        cd packages/desktop
        npx electron-builder --mac --publish never
      notarize-check-artifact-root: packages/desktop/release
      signing-mode: custom
      notarize-mode: none
      publish-mode: artifacts
      post-package-command: |
        cd packages/desktop
        set -e
        KEY_DIR="$RUNNER_TEMP/apple-api"
        KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
        mkdir -p "$KEY_DIR"
        printf '%s' "$APPLE_API_KEY_CONTENT" | openssl base64 -d -A > "$KEY_PATH"
        chmod 600 "$KEY_PATH"
        IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "Error: no Developer ID Application identity in keychain"
          exit 1
        fi
        for dmg in release/*.dmg; do
          codesign --sign "$IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          for attempt in 1 2 3; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "stapler staple failed (attempt $attempt); retrying..."
            sleep 15
          done
        done
      notarize-check-verify: |
        cd packages/desktop
        set -e
        found=0
        for dmg in release/*.dmg; do
          found=1
          codesign --verify --strict --verbose=2 "$dmg"
          for attempt in 1 2 3; do
            xcrun stapler validate "$dmg" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "stapler validate failed (attempt $attempt); retrying..."
            sleep 15
          done
        done
        [ "$found" -eq 1 ] || { echo "No DMG found"; exit 1; }
      artifact-globs: |
        packages/desktop/release/*.dmg
        packages/desktop/release/*.dmg.blockmap
        packages/desktop/release/*.zip
        packages/desktop/release/*.zip.blockmap
        packages/desktop/release/*.exe
        packages/desktop/release/*.AppImage
        packages/desktop/release/*.deb
        packages/desktop/release/*.yml
        packages/desktop/release/*.yaml
        packages/desktop/release/*.blockmap
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

  standalone:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:standalone
      - name: Upload standalone HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          cp packages/standalone/dist/index.html packages/standalone/dist/cite-sight-standalone.html
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            packages/standalone/dist/cite-sight-standalone.html
