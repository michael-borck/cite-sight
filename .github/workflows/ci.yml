name: CI

# Everything the release workflows assume to be true, checked before a tag
# exists. The v0.13.0 npm publish failed because the CLI typechecked against
# last release's core .d.ts — a lockfile problem visible only under `npm ci`,
# which is exactly what this job does.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci, not npm install: if the lockfile drifts from package.json the
      # release would resolve different code than the one tested here.
      - name: Install dependencies
        run: npm ci

      # Guards the bug that broke v0.13.0. When the CLI's range on core no
      # longer matches the local workspace version, npm quietly installs the
      # previous published core into packages/cli/node_modules instead of
      # linking the workspace, and the CLI silently builds against stale types.
      - name: Verify the CLI links the workspace core
        run: |
          node -e "
            const l = require('./package-lock.json');
            const stale = l.packages['packages/cli/node_modules/@michaelborck/cite-sight-core'];
            if (stale) {
              console.error('Lockfile resolves core@' + stale.version + ' from the registry for the CLI.');
              console.error('Expected a workspace link. The CLI would build against a published release.');
              process.exit(1);
            }
            console.log('CLI core dependency:', require('./packages/cli/package.json').dependencies['@michaelborck/cite-sight-core']);
          "

      - name: Lint
        run: npm run lint

      # Build before test. The CLI's e2e tests spawn dist/index.js, so testing
      # a fresh checkout without this step fails on MODULE_NOT_FOUND — a
      # failure a developer with a warm dist/ never sees locally.
      # This is also the typecheck: every package builds via tsc, so it is
      # what catches a package importing an export core does not have.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml — if the wrapper starts
        # using syntax or typing that needs 3.10+, this is where it surfaces.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wrapper
        run: python -m unittest discover -s packages/python -p 'test_*.py'

      # A wheel that builds is not the same as a wheel whose metadata is
      # correct. This is the drift bump.sh used to cause.
      - name: Wheel version matches pyproject
        if: matrix.python-version == '3.9'
        run: |
          pip install --quiet build
          cd packages/python
          python -m build --wheel --outdir /tmp/pkg
          python - <<'PY'
          import glob, re, zipfile
          declared = re.search(r'^version = "(.+)"', open('pyproject.toml').read(), re.M).group(1)
          wheel = glob.glob('/tmp/pkg/citesight-*.whl')[0]
          archive = zipfile.ZipFile(wheel)
          meta_name = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
          built = re.search(r'^Version: (.+)$', archive.read(meta_name).decode(), re.M).group(1)
          print('pyproject:', declared, '| wheel:', built)
          assert declared == built, f'version drift: pyproject {declared} != wheel {built}'
          PY
