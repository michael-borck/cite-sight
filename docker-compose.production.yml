# Example production docker-compose for VPS deployment
# Copy this file to your server and adjust as needed.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Watchtower automatically pulls new images when you push a release tag.
# Caddy network assumes you have a Caddy reverse proxy for HTTPS.

services:
  cite-sight:
    image: michaelborck/cite-sight:latest
    container_name: cite-sight
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      # Delegate analysis to the Python engine (cite-analyser).
      - CITE_ANALYSER_URL=http://cite-analyser:8006
      - CITE_ANALYSIS_ENGINE=${CITE_ANALYSIS_ENGINE:-auto}
    depends_on:
      - redis
      - cite-analyser
    restart: unless-stopped
    networks:
      - caddy_default

  cite-analyser:
    # Build from the cite-analyser repo (Dockerfile included) and push to your
    # registry, or override with CITE_ANALYSER_IMAGE.
    image: ${CITE_ANALYSER_IMAGE:-ghcr.io/michael-borck/cite-analyser:0.2.1}
    container_name: cite-analyser
    expose:
      - "8006"
    restart: unless-stopped
    networks:
      - caddy_default

  redis:
    image: redis:7-alpine
    container_name: cite-sight-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - caddy_default

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    restart: unless-stopped

volumes:
  redis-data:

networks:
  caddy_default:
    external: true
